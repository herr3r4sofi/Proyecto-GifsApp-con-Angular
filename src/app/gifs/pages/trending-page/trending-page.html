<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
  @for (group of gifService.trendingGifGroup(); track $index ){
    <div class="grid gap-4">
      @for (gif of group; track $index ){
        <div>
          <img class="h-full max-w-full object-cover" 
          [src]="gif.url" 
          [alt]="gif.title"
          />
        </div>
      }
    </div>
  }
</div>
